  /api/occurrences/{id}/silence:
    post:
      operationId: silenceOccurrence
      summary: Silence the occurrence's alert on its instance's Alertmanager
      tags:
        - client
      description: "Silences the alert until durationSeconds from now, with an
        Alertmanager silence that matches every label of the alert exactly, so
        it also covers a re-fire. If the alert already has such a silence, it is
        changed to end then, sooner or later, instead of another being added
        (ADR 0015). It mutes the alert for every receiver of that Alertmanager,
        not only Achtung (ADR 0008). 409: the instance has no Alertmanager
        configured. 502: Alertmanager was unreachable or refused the silence."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                durationSeconds:
                  type: integer
                  minimum: 60
                  maximum: 2592000
                  description: How long the silence lasts, from now
              required:
                - durationSeconds
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unsilenceOccurrence
      summary: End the occurrence's alert's own silences on its instance's Alertmanager
      tags:
        - client
      description: "Ends now every silence that matches exactly this alert's labels,
        as POST creates them, so the alert notifies again. A broader silence,
        which mutes other alerts too, is left alone: the answer's silencedUntil
        then still shows it, and when only such a silence mutes the alert,
        nothing is ended and the answer is 409 (ADR 0015). Ending an alert that
        has no silence is not an error. 409: also when the instance has no
        Alertmanager configured. 502: Alertmanager was unreachable or refused."
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/alertmanagers/{instance}/silences:
    post:
      operationId: silenceAlertmanagerAlerts
      summary: Silence several of an Alertmanager's alerts, each exactly
      tags:
        - client
      description: "Silences each alert, found by fingerprint in a fresh read of the
        instance's Alertmanager, with its own silence matching exactly its
        labels, as POST /api/occurrences/{id}/silence does: an exact silence it
        already has is changed to the new end (ADR 0015, ADR 0016). Alerts not
        in Achtung can be silenced too. An alert no longer in Alertmanager gets
        an error and no silence. It mutes the alerts for every receiver of that
        Alertmanager, not only Achtung. 404: the instance has no Alertmanager
        configured. 502: Alertmanager was unreachable or refused; some silences
        may be made, and a retry changes them rather than adding more."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fingerprints:
                  minItems: 1
                  maxItems: 500
                  type: array
                  items:
                    type: string
                    minLength: 1
                  description: The alerts to silence, each by its fingerprint in this Alertmanager
                durationSeconds:
                  type: integer
                  minimum: 60
                  maximum: 2592000
                  description: How long the silence lasts, from now
              required:
                - fingerprints
                - durationSeconds
      parameters:
        - schema:
            type: string
          in: path
          name: instance
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsSilenced"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/occurrences/{id}/reminder:
    put:
      operationId: setOccurrenceReminder
      summary: "Remind about the occurrence at a time: it resurfaces then"
      tags:
        - client
      description: "Sets the occurrence's reminder, replacing one it has, and records
        a reminder_set event. At remindAt the server records a reminded event,
        which moves lastEventAt, so every client shows the occurrence as unread
        again and notifies, whatever its state by then. There are no users, so
        the reminder is everyone's (ADR 0002, ADR 0025). 400: remindAt is not in
        the future, or over a year ahead."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remindAt:
                  type: string
                  format: date-time
                  description: "When to resurface the occurrence: in the future, at most a year
                    ahead. The client turns 'tomorrow morning' into this instant
                    in the user's time zone; the server stores instants only"
              required:
                - remindAt
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: cancelOccurrenceReminder
      summary: Cancel the occurrence's reminder
      tags:
        - client
      description: Cancels the reminder pending on the occurrence and records a
        reminder_cancelled event. Cancelling when none is pending is not an
        error, and records nothing (ADR 0025).
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/occurrences/{id}/metrics/{panel}:
    get:
      operationId: getOccurrenceMetrics
      summary: A graph of what the occurrence's alert is about, from its metrics backend
      tags:
        - client
      description: "The server builds the query from the alert's labels and the panel:
        pod-cpu is the CPU usage of each container of the alert's pod (its
        namespace and pod labels), with their requests and limits. The window:
        for a firing alert the last 3 hours; for a resolved one from 2.5 hours
        before it started to 30 minutes after it ended or now, at least 3 hours
        and at most a day. Answers are reused for 30 seconds (ADR 0026). 404: no
        such occurrence, or it has no such panel (see metricPanels in its
        detail). 502: the metrics backend was unreachable or refused the query."
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
        - schema:
            type: string
            enum:
              - pod-cpu
          in: path
          name: panel
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricGraph"
        "400":
          description: Default Response
