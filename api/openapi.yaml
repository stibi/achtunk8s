  /api/occurrences/{id}/handovers:
    post:
      operationId: createHandover
      summary: Hand the occurrence over to a handler's action
      tags:
        - client
      description: "Asks the handler to act on this alert, e.g. to investigate it. The
        handler takes it when it next asks for work. While a handover of that
        action is requested or running for the occurrence, that one is returned
        (200) and nothing new is made. One no handler takes within 10 minutes
