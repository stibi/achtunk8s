  /api/events:
    get:
      operationId: streamChanges
      summary: What changed, as it happens
      tags:
        - client
      description: >-
        A `text/event-stream` (Server-Sent Events) that stays open. Events:


        - `ready`: sent once the stream is open. Re-read everything: changes
        made while the client wasn't connected were not sent.

        - `changed`: data `{"kind": "occurrences" | "silences" | "settings" |
        "handovers"}`. Re-read that part: occurrences (a notification arrived,
        or one resolved as vanished), silences set or ended through Achtung, the
        shared settings, or handovers and the actions offered for alerts (ADR
        0022).


        A comment line keeps the stream open every so often. Silences changed in
        Alertmanager itself are not announced, so clients still poll, slower, as
        long as the stream is open. 503: too many streams are open.
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChangeEvent"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
