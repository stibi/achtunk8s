openapi: 3.0.3
info:
  title: Achtung
  description: Self-hosted alert inbox. No authentication (ADR 0002), except that
    the handler API can require a token (ADR 0023).
  version: 0.1.0
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Channel:
      type: object
      properties:
        instance:
          type: string
          description: The sending system the channel belongs to, e.g. a cluster
        slug:
          type: string
        firing:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Occurrences in the channel that are firing now
        lastEventAt:
          nullable: true
          description: Latest event in the channel
          type: string
          format: date-time
      required:
        - instance
        - slug
        - firing
        - lastEventAt
    Occurrence:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        instance:
          type: string
          description: The instance of the channel
        channel:
          type: string
        source:
          type: string
        sourceKey:
          type: string
          description: Identity of the alert in its source, e.g. a fingerprint
        status:
          type: string
          enum:
            - firing
            - resolved
        severity:
          type: string
          enum:
            - critical
            - warning
            - info
            - unknown
        title:
          type: string
        summary:
          nullable: true
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        links:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - source
                  - runbook
                  - dashboard
              url:
                type: string
            required:
              - kind
              - url
        startsAt:
          type: string
          format: date-time
        endsAt:
          nullable: true
          description: Set exactly when the status is resolved
          type: string
          format: date-time
        firstReceivedAt:
          type: string
          format: date-time
        lastReceivedAt:
          type: string
          format: date-time
        lastEventAt:
          type: string
          format: date-time
          description: Last time it fired, resolved, reopened or was resent (at most
            hourly, while firing)
        lastEventKind:
          type: string
          enum:
            - fired
            - resolved
            - reopened
            - resent
            - reminded
          description: "What happened at lastEventAt; resent: Alertmanager repeated an
            alert that is still firing; reminded: a reminder set on it came due
            (ADR 0025)"
        notificationCount:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        remindAt:
          nullable: true
          description: When the reminder set on it comes due and resurfaces it; null when
            none is pending (ADR 0025)
          type: string
          format: date-time
        silencedUntil:
          nullable: true
          description: When the Alertmanager silence muting this alert ends; null when
            none does, or when its Alertmanager can't be asked
          type: string
          format: date-time
      required:
        - id
        - instance
        - channel
        - source
        - sourceKey
        - status
        - severity
        - title
        - summary
        - labels
        - annotations
        - links
        - startsAt
        - endsAt
        - firstReceivedAt
        - lastReceivedAt
        - lastEventAt
        - lastEventKind
        - notificationCount
        - remindAt
        - silencedUntil
    Event:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        kind:
          type: string
          enum:
            - fired
            - resolved
            - reopened
            - resent
            - reminded
            - reminder_set
            - reminder_cancelled
          description: reminder_set and reminder_cancelled don't move the occurrence's
            lastEventAt; reminded, when the reminder came due, does (ADR 0025)
        cause:
          nullable: true
          description: "Null when a notification caused the event. vanished: a resolve
            Achtung recorded itself, because the alert was gone from its
            Alertmanager"
          type: string
          enum:
            - vanished
        recordedAt:
          type: string
          format: date-time
        remindAt:
          nullable: true
          description: The time a reminder_set event set the reminder for; null for any
            other kind
          type: string
          format: date-time
      required:
        - id
        - kind
        - cause
        - recordedAt
        - remindAt
    ChannelList:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
      required:
        - channels
    OccurrencePage:
      type: object
      properties:
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
        nextCursor:
          nullable: true
          description: Pass as cursor for the next page; null on the last
          type: string
      required:
        - occurrences
        - nextCursor
    Handover:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        occurrenceId:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        handler:
          type: string
          description: The id of the handler it was handed to
        handlerName:
          type: string
          description: The handler's name when it was asked
        handlerVersion:
          type: string
        action:
          type: string
          description: The id of the handler's action
        title:
          type: string
          description: The action's title when it was asked
        state:
          type: string
          enum:
            - requested
            - running
            - succeeded
            - failed
            - cancelled
            - timed_out
            - expired
          description: "requested: waiting for its handler. running: a handler took it.
            succeeded, failed: the handler's result; failed also when the
            handler stopped answering. cancelled: by a client. timed_out: it ran
            past its deadline. expired: no handler took it within 10 minutes"
        requestedAt:
          type: string
          format: date-time
        claimedAt:
          nullable: true
          description: When a handler took it; null when none did
          type: string
          format: date-time
        deadlineAt:
          nullable: true
          description: "While running: when it times out. Null otherwise"
          type: string
          format: date-time
        finishedAt:
          nullable: true
          description: Set exactly when it is neither requested nor running
          type: string
          format: date-time
        summary:
          nullable: true
          description: "Succeeded: the result in one line of plain text"
          type: string
        body:
          nullable: true
          description: "Succeeded: the result as Markdown. Text from another program:
            render it as text, load nothing remote from it"
          type: string
        links:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
                description: An http or https URL
            required:
              - title
              - url
          description: "Succeeded: what the result points to; empty otherwise"
        error:
          nullable: true
          description: "Failed: why"
          type: string
        progress:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              message:
                type: string
            required:
              - at
              - message
          description: What the handler reported while working, oldest first
      required:
        - id
        - occurrenceId
        - handler
        - handlerName
        - handlerVersion
        - action
        - title
        - state
        - requestedAt
        - claimedAt
        - deadlineAt
        - finishedAt
        - summary
        - body
        - links
        - error
        - progress
    ActionOffer:
      type: object
      properties:
        handler:
          type: string
          description: The id of the handler offering it
        handlerName:
          type: string
        action:
          type: string
          description: The action's id, unique within its handler
        title:
          type: string
          description: What the button says
        description:
          type: string
          description: The button's help text
        available:
          type: boolean
          description: Whether the handler is connected; a handover for one that isn't is
            refused
        lastSeenAt:
          type: string
          format: date-time
          description: The handler's last call
      required:
        - handler
        - handlerName
        - action
        - title
        - description
        - available
        - lastSeenAt
    HandoverPage:
      type: object
      properties:
        handovers:
          type: array
          items:
            $ref: "#/components/schemas/Handover"
        nextCursor:
          nullable: true
          description: Pass as cursor for the next page; null on the last
          type: string
      required:
        - handovers
        - nextCursor
    IrmHeartbeat:
      type: object
      properties:
        status:
          type: string
          enum:
            - receiving
            - missing
            - unknown
          description: "receiving: IRM has no open missed-heartbeat alert group for the
            integration; missing: it has one; unknown: IRM was never read
            successfully"
        since:
          nullable: true
          description: While missing, when IRM opened the group for it; else null
          type: string
          format: date-time
        lastMissedFrom:
          nullable: true
          description: While receiving, when the last missed heartbeat started; else null
          type: string
          format: date-time
        lastMissedTo:
          nullable: true
          description: While receiving, when IRM resolved the last missed heartbeat; else
            null
          type: string
          format: date-time
        checkedAt:
          nullable: true
          description: When IRM was last read successfully; the fields above are from that
            read
          type: string
          format: date-time
        error:
          nullable: true
          description: Why the latest read of IRM failed; null when it worked
          type: string
      required:
        - status
        - since
        - lastMissedFrom
        - lastMissedTo
        - checkedAt
        - error
      description: Whether Grafana IRM receives the heartbeat this Alertmanager sends
        it, read at most once a minute
    OpenAlertCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        critical:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        warning:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        info:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        other:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: No severity label, or one Achtung doesn't know
      required:
        - total
        - critical
        - warning
        - info
        - other
    MissingAlert:
      type: object
      properties:
        fingerprint:
          type: string
          description: Alertmanager's fingerprint, an occurrence's sourceKey
        title:
          type: string
          description: The alertname
        severity:
          type: string
          enum:
            - critical
            - warning
            - info
            - unknown
        startsAt:
          type: string
          format: date-time
      required:
        - fingerprint
        - title
        - severity
        - startsAt
    Delivery:
      type: object
      properties:
        missingInAchtung:
          type: array
          items:
            $ref: "#/components/schemas/MissingAlert"
          description: Notifying in Alertmanager for over 10 minutes, routed to a receiver
            that delivers to Achtung, but not firing in Achtung. Oldest first
        staleInAchtung:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
          description: "Firing in Achtung, last notified over 10 minutes before the read,
            but gone from Alertmanager: a resolve that never arrived. Oldest
            first"
      required:
        - missingInAchtung
        - staleInAchtung
    AlertmanagerOverview:
      type: object
      properties:
        instance:
          type: string
        reachable:
          type: boolean
          description: Whether the latest read of its alerts succeeded
        error:
          nullable: true
          description: Why the latest read failed; null when reachable
          type: string
        checkedAt:
          nullable: true
          description: When its alerts were last read successfully; the fields below are
            from that read
          type: string
          format: date-time
        open:
          nullable: true
          description: Alerts that are notifying (not silenced or inhibited), by severity;
            null when never read
          allOf:
            - $ref: "#/components/schemas/OpenAlertCounts"
        silenced:
          nullable: true
          type: integer
          minimum: 0
          maximum: 9007199254740991
        inhibited:
          nullable: true
          description: Inhibited and not silenced
          type: integer
          minimum: 0
          maximum: 9007199254740991
        watchdog:
          nullable: true
          description: Whether the Watchdog alert is there, i.e. the alerting pipeline
            works; also while Watchdog is an ignored name
          type: string
          enum:
            - firing
            - absent
        delivery:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Delivery"
        irm:
          nullable: true
          description: Null when Grafana IRM isn't configured, or the Alertmanager has no
            IRM integration
          allOf:
            - $ref: "#/components/schemas/IrmHeartbeat"
      required:
        - instance
        - reachable
        - error
        - checkedAt
        - open
        - silenced
        - inhibited
        - watchdog
        - delivery
        - irm
      description: Counts and delivery leave out the ignored alert names
        (/api/settings/ignored-alerts), e.g. Watchdog, which fires all the time
    Matcher:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        isRegex:
          type: boolean
        isEqual:
          type: boolean
          description: False negates the match (!= or !~)
      required:
        - name
        - value
        - isRegex
        - isEqual
    Silence:
      type: object
      properties:
        instance:
          type: string
        id:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        createdBy:
          type: string
        comment:
          type: string
        matchers:
          type: array
          items:
            $ref: "#/components/schemas/Matcher"
      required:
        - instance
        - id
        - startsAt
        - endsAt
        - createdBy
        - comment
        - matchers
    NoisyAlert:
      type: object
      properties:
        occurrence:
          $ref: "#/components/schemas/Occurrence"
        events:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Its fired, reopened and resent events in the last 24 hours
      required:
        - occurrence
        - events
    Home:
      type: object
      properties:
        alertmanagers:
          type: array
          items:
            $ref: "#/components/schemas/AlertmanagerOverview"
          description: Every configured Alertmanager, by instance name
        silences:
          type: array
          items:
            $ref: "#/components/schemas/Silence"
          description: Silences active now on every Alertmanager, the soonest to end first
        noisiest:
          type: array
          items:
            $ref: "#/components/schemas/NoisyAlert"
          description: Up to 10 alerts with 2 or more events in the last 24 hours, most
            first, each as its newest occurrence
        longestFiring:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
          description: Up to 10 firing occurrences, the earliest start first
      required:
        - alertmanagers
        - silences
        - noisiest
        - longestFiring
    AlertmanagerAlert:
      type: object
      properties:
        fingerprint:
          type: string
          description: Alertmanager's fingerprint, an occurrence's sourceKey
        title:
          type: string
          description: The alertname, else the fingerprint
        severity:
          type: string
          enum:
            - critical
            - warning
            - info
            - unknown
        summary:
          nullable: true
          description: The summary annotation, else the description
          type: string
        startsAt:
          type: string
          format: date-time
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        state:
          type: string
          enum:
            - active
            - silenced
            - inhibited
          description: "active: notifying, or not routed yet; silenced: a silence mutes
            it, inhibited or not; inhibited: only inhibited"
        silencedUntil:
          nullable: true
          description: When the latest silence muting it ends; null unless silenced, or
            when Achtung doesn't know that silence yet
          type: string
          format: date-time
        occurrenceId:
          nullable: true
          description: The occurrence of this firing (same fingerprint and startsAt) on
            the instance; null when Achtung has none
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
      required:
        - fingerprint
        - title
        - severity
        - summary
        - startsAt
        - labels
        - annotations
        - state
        - silencedUntil
        - occurrenceId
    AlertmanagerAlertList:
      type: object
      properties:
        instance:
          type: string
        reachable:
          type: boolean
          description: Whether the latest read of its alerts succeeded
        error:
          nullable: true
          description: Why the latest read failed; null when reachable
          type: string
        checkedAt:
          nullable: true
          description: When its alerts were last read successfully; the fields below are
            from that read
          type: string
          format: date-time
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertmanagerAlert"
          description: By severity (critical, warning, info, unknown), then the newest
            start first; empty when never read
      required:
        - instance
        - reachable
        - error
        - checkedAt
        - alerts
      description: "The alerts the tile counts: active ones are open, the others
        silenced and inhibited. Leaves out the ignored alert names
        (/api/settings/ignored-alerts)"
    MetricGraph:
      type: object
      properties:
        panel:
          type: string
          description: The panel asked for, e.g. pod-cpu
        unit:
          type: string
          enum:
            - cores
          description: "What the values are: CPU cores for pod-cpu"
        from:
          type: string
          format: date-time
          description: The window's start
        to:
          type: string
          format: date-time
          description: The window's end
        stepSeconds:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
          description: The time between two points
        series:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: What the series is of, e.g. the container's name
              role:
                type: string
                enum:
                  - usage
                  - request
                  - limit
                description: "usage: what was used; request and limit: the Kubernetes request
                  and limit to read it against"
              points:
                type: array
                items:
                  type: object
                  properties:
                    at:
                      type: string
                      format: date-time
                    value:
                      type: number
                  required:
                    - at
                    - value
                description: "Oldest first, one per step where the backend has a value: a gap is
                  missing points, and a series that ends early ended (e.g. the
                  pod is gone)"
            required:
              - name
              - role
              - points
          description: By name, then usage, request, limit. Without usage there are no
            series
        truncated:
          type: boolean
          description: "True when series were left out: only the 10 with the highest usage
            are sent"
      required:
        - panel
        - unit
        - from
        - to
        - stepSeconds
        - series
        - truncated
    IgnoredAlertNames:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
          description: Alert names, sorted
      required:
        - names
      description: Alert names the Home views leave out of an Alertmanager's counts,
        its alert list and its delivery check. Matched exactly and
        case-sensitively against the alertname label. The inbox shows these
        alerts as usual
    AlertsSilenced:
      type: object
      properties:
        alerts:
          type: array
          items:
            type: object
            properties:
              fingerprint:
                type: string
              silencedUntil:
                nullable: true
                description: When its silence ends; null when it wasn't silenced
                type: string
                format: date-time
              error:
                nullable: true
                description: Why it wasn't silenced; null when it was
                type: string
            required:
              - fingerprint
              - silencedUntil
              - error
      required:
        - alerts
      description: One entry per fingerprint asked for, in that order
    OccurrenceDetail:
      type: object
      properties:
        occurrence:
          $ref: "#/components/schemas/Occurrence"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
          description: Oldest first
        otherOccurrences:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
          description: Other occurrences of the same alert, newest first, at most 20
        metricPanels:
          description: "The graphs GET /api/occurrences/{id}/metrics/{panel} has for it,
            e.g. pod-cpu (ADR 0026): none when its instance has no metrics
            backend or the alert names nothing a panel shows. A string, not an
            enum, so a client skips the panels it doesn't know. Always sent;
            absent from servers before graphs"
          type: array
          items:
            type: string
        actions:
          description: What handlers offer to do with this alert, each a button (ADR 0022)
          type: array
          items:
            $ref: "#/components/schemas/ActionOffer"
        handovers:
          description: This occurrence's handovers, newest first, at most 20
          type: array
          items:
            $ref: "#/components/schemas/Handover"
      required:
        - occurrence
        - events
        - otherOccurrences
    ChangeEvent:
      type: object
      properties:
        kind:
          type: string
          enum:
            - occurrences
            - silences
            - settings
            - handovers
      required:
        - kind
      description: What changed
    AlertHandler:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        actions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                description: Unique within the handler
              title:
                type: string
                minLength: 1
                maxLength: 40
                description: What the button says
              description:
                type: string
                maxLength: 200
                description: The button's help text
              timeoutSeconds:
                type: integer
                minimum: 60
                maximum: 3600
                description: How long one handover may run before it times out
              appliesTo:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      type: string
                    description: "Empty: every instance"
                  severities:
                    type: array
                    items:
                      type: string
                      enum:
                        - critical
                        - warning
                        - info
                        - unknown
                    description: "Empty: every severity"
                  labels:
                    type: object
                    additionalProperties:
                      type: string
                required:
                  - instances
                  - severities
                  - labels
            required:
              - id
              - title
              - description
              - timeoutSeconds
              - appliesTo
      required:
        - id
        - name
        - version
        - actions
      description: The handler as registered, with defaults filled in
    ClaimedHandover:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
          description: The handover
        action:
          type: string
          description: Which of the handler's actions was asked for
        claimToken:
          type: string
          description: Send it as the Achtung-Claim header with every later call for this
            handover
        leaseSeconds:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
          description: Call progress at least this often, or the handover fails as handler
            lost
        deadlineAt:
          type: string
          format: date-time
          description: When the handover times out
        requestedAt:
          type: string
          format: date-time
        occurrence:
          $ref: "#/components/schemas/Occurrence"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
          description: Oldest first
        otherOccurrences:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
          description: Other occurrences of the same alert, newest first, at most 20
      required:
        - id
        - action
        - claimToken
        - leaseSeconds
        - deadlineAt
        - requestedAt
        - occurrence
        - events
        - otherOccurrences
      description: A handover, now this handler's to run, with the occurrence as GET
        /api/occurrences/{id} returns it. Alert labels and annotations are
        untrusted text written by other systems
    IngestSummary:
      type: object
      properties:
        alerts:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        new:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Occurrences that fired or reopened
        resolved:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - alerts
        - new
        - resolved
paths:
  /ingest/alertmanager/{instance}/{channel}:
    post:
      operationId: ingestAlertmanager
      summary: Webhook for alertmanager. The body is the source's own payload.
      tags:
        - ingest
      parameters:
        - schema:
            type: string
          in: path
