        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/handovers/{id}/cancel:
    post:
      operationId: cancelHandover
      summary: Cancel a handover that is requested or running
      tags:
        - client
      description: "It is cancelled at once. A handler working on it learns so from
        its next progress call and stops. 409: it has ended already."
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handover"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/handler/v0/handlers/{handler}:
    put:
      operationId: registerHandler
      summary: Register a handler and the actions it offers
      tags:
        - handler
      description: "Call it at startup, again when the actions change, and after a
        claim answered 404. It replaces the handler's earlier registration. Each
        action becomes a button on the alerts it applies to, enabled while the
        handler keeps calling. 409: 50 handlers are registered already. With
        handler tokens configured: 401 without a valid bearer token, 403 when it
        is another handler's."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: Shown in the client
                version:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: The handler's own version
                actions:
                  minItems: 1
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                        description: Unique within the handler
                      title:
                        type: string
                        minLength: 1
                        maxLength: 40
                        description: What the button says
                      description:
                        default: ""
                        type: string
                        maxLength: 200
                        description: The button's help text
                      timeoutSeconds:
                        default: 900
                        type: integer
                        minimum: 60
                        maximum: 3600
                        description: How long one handover may run before it times out
                      appliesTo:
                        default: {}
                        type: object
                        properties:
                          instances:
                            minItems: 1
                            maxItems: 50
                            type: array
                            items:
                              type: string
                              minLength: 1
                          severities:
                            minItems: 1
                            type: array
                            items:
                              type: string
                              enum:
                                - critical
                                - warning
                                - info
                                - unknown
                          labels:
                            description: Each label must be there with exactly this value
                            type: object
                            additionalProperties:
                              type: string
                        description: "Which alerts the action is for. Every part given must match; none
                          given: every alert"
                    required:
                      - id
                      - title
              required:
                - name
                - version
                - actions
      parameters:
        - schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          in: path
          name: handler
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertHandler"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeHandler
      summary: Forget a handler
      tags:
        - handler
      description: "Its actions are no longer offered. Its handovers stay. Removing an
        unknown handler is not an error. With handler tokens configured: 401
        without a valid bearer token, 403 when it is another handler's."
      parameters:
        - schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          in: path
          name: handler
          required: true
      responses:
        "204":
          description: Forgotten
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
                description: Forgotten
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/handler/v0/handlers/{handler}/claim:
    post:
      operationId: claimHandover
      summary: Take the handler's next handover, waiting for one if asked
      tags:
        - handler
      description: "Answers at once with the oldest handover requested of this
        handler, which is then running and this handler's alone: it is given out
        at most once and never again. With none waiting, the request is held for
        up to `wait` seconds and answered as soon as one arrives, else with 204.
        Every call counts as the handler being connected. Keep calling in a
        loop. 404: the handler isn't registered; register, then claim again.
        503: too many claims are waiting; try again after a pause. With handler
        tokens configured: 401 without a valid bearer token, 403 when it is
        another handler's."
      parameters:
        - schema:
            default: 10
            type: integer
            minimum: 0
            maximum: 30
          in: query
          name: wait
          required: false
          description: Seconds to wait for a handover. Over 10 needs a gateway that
            doesn't cut requests off at 15 s
        - schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          in: path
          name: handler
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimedHandover"
        "204":
          description: Nothing to do
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
                description: Nothing to do
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/handler/v0/handovers/{id}/progress:
    post:
      operationId: reportHandoverProgress
      summary: Keep a claimed handover alive, with a status line if there is one
      tags:
        - handler
      description: "Renews the handover's lease, and records the message for the
        client to show. Up to 200 messages are kept; later ones only renew the
        lease. The answer says where the handover is: anything but running means
        stop working on it, e.g. cancelled by a client. Send the claim token as
        the Achtung-Claim header. 403: it is missing or not this handover's."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              nullable: true
              type: object
              properties:
                message:
                  description: A status line for the client; without one the call only renews the
                    lease
                  type: string
                  minLength: 1
                  maxLength: 500
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum:
                      - requested
                      - running
                      - succeeded
                      - failed
                      - cancelled
                      - timed_out
                      - expired
                  leaseSeconds:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                    maximum: 9007199254740991
                    description: Call again within this long
                required:
                  - state
                  - leaseSeconds
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/handler/v0/handovers/{id}/result:
    post:
      operationId: answerHandover
      summary: End a claimed handover with its result
      tags:
        - handler
      description: "succeeded, with a one-line summary, a Markdown body and links, or
        failed, with the reason. The same result sent again is answered as
        before. 409: the handover ended another way first (cancelled, timed out,
        handler lost) or with a different result. Send the claim token as the
        Achtung-Claim header. 403: it is missing or not this handover's."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    outcome:
                      type: string
                      enum:
                        - succeeded
                    summary:
                      type: string
                      minLength: 1
                      maxLength: 300
                      pattern: ^[^\r\n]*$
                      description: One line of plain text
                    body:
                      type: string
                      maxLength: 65536
                      description: Markdown; rendered as text
                    links:
                      maxItems: 10
                      type: array
                      items:
                        type: object
                        properties:
                          title:
                            type: string
                            minLength: 1
                            maxLength: 100
                          url:
                            type: string
                            maxLength: 2000
                        required:
                          - title
                          - url
                  required:
                    - outcome
                    - summary
                    - body
                - type: object
                  properties:
                    outcome:
                      type: string
                      enum:
                        - failed
                    error:
                      type: string
                      minLength: 1
                      maxLength: 2000
                      description: Why, for the person who asked
                  required:
                    - outcome
                    - error
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handover"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
