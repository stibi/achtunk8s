# Run with --strict (scripts/check.sh does), so every warning fails the check.
# Limits match the server's Biome config (docs/adr/0003-quality-enforcement.md).
included:
  - Achtung
  - Packages
excluded:
  - Packages/*/.build

opt_in_rules:
  - force_unwrapping

cyclomatic_complexity:
  warning: 12
function_body_length:
  warning: 60
file_length:
  warning: 300
line_length:
  warning: 100 # same as .swift-format
force_cast: error
force_unwrapping: error

# swift format owns layout; these SwiftLint rules disagree with it.
disabled_rules:
  - trailing_comma
  - opening_brace

custom_rules:
  packages_no_ui_imports:
    name: No UI imports in the packages
    included: "Packages/.*\\.swift$"
    regex: "^\\s*(@\\w+\\s+)*import\\s+(\\w+\\s+)?(SwiftUI|AppKit|Cocoa)\\b"
    message: >-
      AchtungDomain and AchtungAPI must build on Linux, so they can't import SwiftUI or
      AppKit. Move UI code to the app target (macos/Achtung/).
    severity: error
  shortcuts_from_the_catalogue:
    name: Shortcuts come from the catalogue
    included: "Achtung/.*\\.swift$"
    excluded: "Achtung/ShortcutKeys\\.swift$"
    regex: "\\.keyboardShortcut\\((?!\\.(defaultAction|cancelAction)\\))"
    message: >-
      Add the shortcut to Shortcut (AchtungDomain) and bind it with .shortcut(...), so the
      keyboard shortcuts help (⌥?) lists it. Only a dialog's default and cancel buttons
      are exempt.
    severity: error
  key_presses_from_the_catalogue:
    name: Key presses come from the catalogue
    included: "Achtung/.*\\.swift$"
    regex: "\\.onKeyPress\\s*(\\{|\\((?!(keys: \\[)?Shortcut\\.))"
    message: >-
      Add the key to Shortcut (AchtungDomain) and pass its keyEquivalent, e.g.
      .onKeyPress(Shortcut.open.keyEquivalent), so the keyboard shortcuts help (⌥?)
      lists it.
    severity: error
